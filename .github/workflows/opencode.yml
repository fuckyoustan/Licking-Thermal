name: OpenCode Agent

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # public trigger hardening (P0-3): only the repo owner and collaborators
    # may launch the agent; any other GitHub user commenting /oc is skipped.
    if: >-
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode')) &&
      !contains(github.actor, '[bot]') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode Agent
        # pinned to a full commit SHA (tag github-v1.2.28) — a mutable tag
        # like @latest is a supply-chain takeover vector for a workflow with
        # write permissions
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166
        env: {}
        with:
          model: opencode/big-pickle
          agent: general
          prompt: |
            {
              "temperature": 0.05,
              "steps": 8,
              "reasoningEffort": "low",
              "textVerbosity": "low",
              "top_p": 0.9
            }
            You are a fast and precise coding agent.
            Think VERY briefly in <thinking> tags (max 100 words total).
            Stick strictly to files and request — no assumptions or invented code.
            If uncertain, say so immediately.
            Output ONLY necessary changes/diffs — be ultra-concise, no extra explanations.
